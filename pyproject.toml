[project]
name = "twinfit"
version = "0.1.0"
description = "Phone video of a mechanism to a verified MuJoCo simulation twin."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Ahaan Kothari" }]
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.0",
    "jinja2>=3.1",
    "opencv-contrib-python>=4.8",
    "mujoco>=3.2",
    "pin>=3.0",
    "imageio>=2.34",
    "imageio-ffmpeg>=0.5",
    "matplotlib>=3.8",
    "pandas>=2.2",
    "pyarrow>=15.0",
    "filelock>=3.13",
    "python-dotenv>=1.0",
    "openai>=1.50",
]

[project.optional-dependencies]
perception = []
identify = []
verify = []
agent = []

[project.scripts]
twinfit = "twinfit.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-timeout>=2.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/twinfit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
markers = [
    "live: calls the paid Meta API (skipped unless TWINFIT_LIVE=1)",
    "render: MuJoCo offscreen rendering",
    "slow: slow test",
]
timeout = 900

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/twinfit/**/cli.py" = ["B008"]
